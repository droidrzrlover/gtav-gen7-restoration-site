<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News | Previous Gen Mods</title><meta name="description" content="News and development updates from Previous Gen Mods."><link rel="icon" href="previous-gen-mods-logo.png"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171714;color:#eee5d2;font:16px/1.7 Arial,sans-serif}a{color:#f6bb51}header{background:#101010;border-bottom:4px solid #f5b44c;padding:20px max(24px,calc((100vw - 1050px)/2))}header a{font-weight:900;text-transform:uppercase;text-decoration:none;letter-spacing:.08em}main{max-width:1050px;margin:auto;padding:65px 24px}h1,h2{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;line-height:1.1}h1{font-size:clamp(48px,8vw,90px);margin:12px 0}h2{font-size:36px;margin:10px 0}small,.date{color:#f5b44c;text-transform:uppercase;font-weight:900;letter-spacing:.13em}.intro{color:#c8c1b3}.card{display:block;color:inherit;text-decoration:none;border:1px solid #615a4b;background:#272721;padding:28px;margin:18px 0}.card:hover{border-color:#f5b44c}.card p{color:#c9c2b5}.article{max-width:780px}.article img{max-width:100%;height:auto}.article a{text-decoration:underline}.article h2{font-size:32px}.back{display:inline-block;margin-bottom:25px}footer{border-top:2px solid #f5b44c;padding:25px;text-align:center;color:#bcb5a8}.empty{padding:25px;border:1px dashed #726b5c}.article blockquote{border-left:4px solid #f5b44c;padding-left:20px}
</style></head><body><header><a href="/">← Previous Gen Mods</a></header><main><div id="content"><small>Dispatches from Los Santos</small><h1>Latest News</h1><p class="intro">Updates from the GTA V Gen 7 Restoration project.</p><p>Loading news…</p></div></main><footer>Previous Gen Mods · Independent fan project</footer><script>
const root=document.getElementById('content');const params=new URLSearchParams(location.search);const slug=params.get('article');
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function safeSlug(s){return typeof s==='string'&&/^[a-z0-9-]{1,100}$/.test(s)}
function formatDate(d){const t=new Date(d);return Number.isNaN(t.valueOf())?'':t.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
function renderList(items){root.replaceChildren(el('small','','Dispatches from Los Santos'),el('h1','','Latest News'),el('p','intro','Published project announcements and development updates.'));if(!items.length){root.append(el('p','empty','No public news articles have been synchronized yet.'));return}for(const a of items){if(!safeSlug(a.slug))continue;const card=el('a','card');card.href='?article='+encodeURIComponent(a.slug);card.append(el('small','date',formatDate(a.date)),el('h2','',a.title||'Untitled'),el('p','',a.summary||''));root.append(card)}}
async function render(){try{const res=await fetch('news/articles.json',{cache:'no-cache'});if(!res.ok)throw Error('Feed unavailable');const data=await res.json();const items=Array.isArray(data.articles)?data.articles:[];if(!slug){renderList(items);return}const a=items.find(x=>x.slug===slug);if(!a||!safeSlug(slug)){root.replaceChildren(el('h1','','Article not found'));return}const content=await fetch('news/articles/'+slug+'.html');if(!content.ok)throw Error('Article unavailable');const html=await content.text();root.replaceChildren();const back=el('a','back','← All news');back.href='news.html';root.append(back,el('small','date',formatDate(a.date)),el('h1','',a.title||'Untitled'));const article=el('article','article');/* HTML is produced only by the trusted publishing pipeline; sanitize before committing. */article.innerHTML=html;root.append(article);document.title=(a.title||'News')+' | Previous Gen Mods'}catch(e){root.replaceChildren(el('h1','','News unavailable'),el('p','','The news feed could not be loaded. Please try again later.'))}}render();
</script></body></html>
